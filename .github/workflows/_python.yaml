name: Python CI Workflow

on:
  workflow_call:
    secrets:
      PYPI_API_TOKEN:
        required: true

jobs:
  # ----------------------------------------------------------------------------
  # Build Python Wheels
  # ----------------------------------------------------------------------------

  python-build-wheels:
    name: Build wheels on ${{ matrix.platform.runner }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { runner: ubuntu-latest, artifact: linux-x86_64 }
          - { runner: macos-13, artifact: macos-x86_64 }
          - { runner: macos-14, artifact: macos-arm64 }
          - { runner: windows-latest, artifact: windows-x86_64 }
    env:
      CI: true
      BAZELISK_ALLOW_ENVS: Y
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel
          key: bazel-${{ runner.os }}
          restore-keys: bazel-${{ runner.os }}

      - name: Build wheels
        shell: bash
        run: |
          bazel build //python:wheel.dist
          BAZEL_BIN="$(bazel info bazel-bin)"
          mkdir -p dist
          cp "${BAZEL_BIN}/python/dist/"*.whl dist/

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform.artifact }}
          path: dist/*.whl

  # ----------------------------------------------------------------------------
  # Test Python Bindings
  # ----------------------------------------------------------------------------

  python-test:
    name: Test Python Bindings
    runs-on: ubuntu-latest
    needs: python-build-wheels
    env:
      CI: true
      BAZELISK_ALLOW_ENVS: Y
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel
          key: bazel-${{ runner.os }}
          restore-keys: bazel-${{ runner.os }}

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download Linux wheel
        uses: actions/download-artifact@v4
        with:
          name: wheels-linux-x86_64
          path: dist/

      - name: Smoke test built wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          python -c "import dv_py; value = dv_py.DimensionalVariable(10, 'm').value(); print(value)"

      - name: Test Python Bindings
        run: bazel test //python/... --test_output=errors --keep_going

      - name: Run Python Example
        run: bazel run //examples/python:python_example

      - name: Run Python Regression Tests
        run: bazel test //tests:regression_python_tests --test_output=errors --keep_going

  # ----------------------------------------------------------------------------
  # Publish Python Wheels
  # ----------------------------------------------------------------------------

  python-publish-pypi:
    name: Publish Python Wheels to PyPI
    needs: [python-build-wheels, python-test]
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist/
